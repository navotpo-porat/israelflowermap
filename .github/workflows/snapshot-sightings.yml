# Once a day, save the current map (from the live site's /api/sightings) into
# src/data/sightings-snapshot.json. The site shows this snapshot instantly while
# loading, and keeps showing it if the live fetch ever fails.
name: Snapshot map sightings

on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sightings from the live site
        run: |
          curl -fsSL "https://www.israelflowermap.com/api/sightings?snapshot=$(date +%s)" -o /tmp/sightings.json
          jq -e '.success == true and (.data | length) > 0' /tmp/sightings.json > /dev/null
          jq '{updatedAt: (now | todate), data: .data}' /tmp/sightings.json > /tmp/snapshot.json
          # Only rewrite the file if the points themselves changed (ignore the timestamp)
          if [ "$(jq -S .data /tmp/snapshot.json)" != "$(jq -S .data src/data/sightings-snapshot.json)" ]; then
            cp /tmp/snapshot.json src/data/sightings-snapshot.json
          fi
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update map sightings snapshot"
          git push
